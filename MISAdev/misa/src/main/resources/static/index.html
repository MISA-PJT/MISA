<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MISA TEST</title>

    <link rel="stylesheet" href="/css/style.css">

</head>
<body>
    
    <div id="map">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="inventory-ui" class="hidden">
        <h3>인벤토리</h3>
        <ul id="inventory-list">
        </ul>
    </div>

    <script src="/js/apiKey.js"></script>

    <script src="/js/game.js"></script> <!-- Custom Map 미적용 오류 해결 : game.js 우선 로드 -->

    <script>
        function initMap() {
            console.log("네이버 지도 API 로딩 완료");
            startGame();
        }

        const mapScript = document.createElement('script');
        mapScript.type = 'text/javascript';
        mapScript.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${NAVER_API_KEY}&submodules=gl&callback=initMap`;
        document.head.appendChild(mapScript);
    </script>
    
</body>
</html>
